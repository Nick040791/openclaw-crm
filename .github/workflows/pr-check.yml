name: PR Check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: |
          # ESLint may not be fully configured yet; fail soft until ruleset lands
          pnpm lint || echo "Lint skipped or incomplete (acceptable for current skeleton)"

      - name: Validate documentation and structure
        run: |
          echo "🔍 Validating repository structure and docs..."
          test -f README.md
          test -f docs/architecture.md
          test -f docs/roadmap.md
          test -f docs/openclaw-integration.md
          test -f docs/modules.md || (echo 'Missing docs/modules.md' && exit 1)
          test -d core/ || (echo 'Missing core/ (module registry)' && exit 1)
          test -f core/module-registry.ts
          test -f core/register-modules.ts
          test -d modules/contacts/
          test -d modules/companies/
          test -d integrations/openclaw/tools/
          test -d integrations/openclaw/bridge/
          test -f integrations/openclaw/bridge/httpServer.ts
          test -f integrations/openclaw/bridge/auditSink.ts
          test -d integrations/openclaw/skills/crm-bridge/
          test -f Dockerfile || (echo 'Missing Dockerfile' && exit 1)
          test -f docker-compose.yml
          echo "✅ Structure validation passed"

      - name: Docker build validation
        run: |
          echo "🔍 Testing Docker image build (bridge target)..."
          docker build -t openclaw-crm-bridge:ci .
          echo "✅ Docker build succeeded"

      - name: Tool catalog smoke check
        run: |
          echo "🔍 Validating tool catalog exports via type-check (already run) + file presence..."
          test -f integrations/openclaw/tools/index.ts
          test -f integrations/openclaw/tools/createContact.ts
          test -f integrations/openclaw/tools/deleteContact.ts
          test -f integrations/openclaw/tools/createCompany.ts
          test -f integrations/openclaw/tools/deleteCompany.ts
          test -f integrations/openclaw/tools/listContactsByCompany.ts
          echo "✅ Tool surface files present"

  # TODO: unit tests for schemas/services, security scan, Next.js build when app/ lands
